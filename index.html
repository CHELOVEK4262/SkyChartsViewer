            if (!pdfDocument) {

                return;
            }


            manualRotation += 90;


            if (
                manualRotation >= 360
            ) {

                manualRotation = 0;
            }


            rotation =
                (
                    automaticRotation +
                    manualRotation
                ) % 360;


            showPage(
                currentPage
            );

        }
    );



    /* =====================================
       НОЧНОЙ РЕЖИМ
       ===================================== */

    invertButton.addEventListener(
        "click",
        function () {

            inverted =
                !inverted;


            if (inverted) {

                canvas.style.filter =
                    "invert(1)";


                invertButton.textContent =
                    "☀ Обычная версия";

            }

            else {

                canvas.style.filter =
                    "none";


                invertButton.textContent =
                    "☾ Ночная версия";

            }

        }
    );



    /* =====================================
       ПЕРЕМЕЩЕНИЕ ЛКМ
       ===================================== */

    viewer.addEventListener(
        "mousedown",
        function (event) {

            if (
                event.button !== 0
            ) {

                return;
            }


            if (!pdfDocument) {

                return;
            }


            isDragging =
                true;


            dragStartX =
                event.clientX;


            dragStartY =
                event.clientY;


            dragOffsetX =
                targetOffsetX;


            dragOffsetY =
                targetOffsetY;


            viewer.classList.add(
                "dragging"
            );


            event.preventDefault();

        }
    );



    /* =====================================
       ПЕРЕМЕЩЕНИЕ
       ===================================== */

    window.addEventListener(
        "mousemove",
        function (event) {

            if (!isDragging) {

                return;
            }


            const dx =
                event.clientX -
                dragStartX;


            const dy =
                event.clientY -
                dragStartY;


            targetOffsetX =
                dragOffsetX +
                dx;


            targetOffsetY =
                dragOffsetY +
                dy;


            startAnimation();

        }
    );



    /* =====================================
       ОТПУСКАНИЕ ЛКМ
       ===================================== */

    window.addEventListener(
        "mouseup",
        function () {

            isDragging =
                false;


            viewer.classList.remove(
                "dragging"
            );

        }
    );



    window.addEventListener(
        "blur",
        function () {

            isDragging =
                false;


            viewer.classList.remove(
                "dragging"
            );

        }
    );



    /* =====================================
       ВЫБРАТЬ ДРУГОЙ PDF
       ===================================== */

    changeFile.addEventListener(
        "click",
        function () {

            pdfDocument = null;


            pageNames = {};

            pageCategories = {};


            pinnedPages =
                new Set();


            currentPdfName =
                "";


            currentPage =
                1;


            currentCategory =
                "TAXI";


            currentSearch =
                "";


            chartSearch.value =
                "";


            categoryButtons.forEach(
                function (button) {

                    button.classList.toggle(

                        "active",

                        button.dataset.category ===
                        "TAXI"

                    );

                }
            );


            rotation = 0;
            automaticRotation = 0;
            manualRotation = 0;

            inverted = false;

            zoom = 1;

            renderedZoom = 1;

            targetZoom = 1;

            offsetX = 0;

            offsetY = 0;

            targetOffsetX = 0;

            targetOffsetY = 0;


            if (animationFrame) {

                cancelAnimationFrame(
                    animationFrame
                );

                animationFrame = null;

            }


            clearTimeout(
                renderTimer
            );


            ctx.clearRect(

                0,
                0,

                canvas.width,
                canvas.height

            );


            canvas.width = 0;

            canvas.height = 0;


            canvas.style.filter =
                "none";


            pageList.innerHTML =
                "";


            pagesTitle.textContent =
                "TAXI";


            invertButton.textContent =
                "☾ Ночная версия";


            pageBlock.style.display =
                "none";

            const app =
                document.getElementById("app");

            if (app) {
                app.classList.add("initial");
            }

            uploadBlock.style.display =
                "block";


            chartSelect.value = "";
            airportInput.value = "";
            if (airportSuggestions) {
                airportSuggestions.innerHTML = "";
                airportSuggestions.style.display = "none";
            }

            chartSelect.innerHTML =
                '<option value="">Введите код аэропорта</option>';

            chartSelect.disabled = true;
            openChartButton.disabled = true;

            loadCharts();

        }
    );



    /* =====================================
       ИЗМЕНЕНИЕ РАЗМЕРА ОКНА
       ===================================== */

    let resizeTimer = null;


    window.addEventListener(
        "resize",
        function () {

            if (!pdfDocument) {

                return;
            }


            clearTimeout(
                resizeTimer
            );


            resizeTimer =
                setTimeout(
                    function () {

                        showPage(
                            currentPage
                        );

                    },
                    150
                );

        }
    );


</script>



</body>
